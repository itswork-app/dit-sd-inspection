name: Bootstrap npm lockfile

on:
  push:
    branches:
      - feat/foundation-bootstrap-v1-rebased
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: npm-lockfile-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-verify-commit:
    # The bot commit is the output of this one-time bootstrap and must not start a loop.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate authentic npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean reproducible install
        run: npm ci --no-audit --no-fund

      - name: Run repository quality gate
        run: npm run check

      - name: Commit lockfile to the target branch
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No package-lock.json change was generated."
            test -s package-lock.json
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build(deps): add reproducible npm lockfile"
          git push origin "HEAD:${BRANCH_NAME}"
